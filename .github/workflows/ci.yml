name: CI

# ⚠ `push` on EVERY branch, not just main. This is the fix for the third shape
# of the unverified-merge gap, and it is the only one of the three a human
# cannot catch by looking:
#
#   PR never opened .................. nothing ran
#   PR merged red .................... ran, failed, merged anyway
#   PR closed, commits pushed after .. nothing ran, AND nothing indicated that
#
# The first two are visible to anyone who checks. The third is invisible by
# construction — a commit on a branch whose PR has closed is indistinguishable
# from one awaiting review. It happened on this repository within an hour of
# the second shape being written up.
#
# Cost is why this is split rather than "everything on every push". A full run
# is ~25 billable minutes and the free private-repo allowance is 2,000 a month,
# so the whole matrix on every push exhausts it in about a fortnight. So:
#
#   verify + snapshots  every push, every branch     ~3 min
#   qa (both engines)   pull_request and main only   ~22 min
#
# Every push therefore produces a signal — ON A BRANCH WHOSE TREE CONTAINS THIS
# FILE. That caveat is the whole rollout problem, and it is self-concealing:
#
#   For a `push` event GitHub resolves the workflow from the tree of the pushed
#   commit, NOT from main. A branch created before this change still carries the
#   old `push: [main]` and still runs nothing.
#
# So merging this fixes main and every branch cut from it afterwards, and fixes
# NOTHING for the branches that already exist — which are exactly the stale ones
# the incident happened on. Worse, anyone verifying the fix will push to the
# branch carrying it, watch the jobs run, and conclude it works everywhere.
# See docs/decisions-pending.md D8 for the branch-by-branch state and the
# rollout step, which is branch hygiene rather than YAML.
#
# See D7 for why a required status check — the actual gate — is unavailable on
# this plan.
#
# ⚠ One shape this does NOT close, and cannot: while a pull request has a merge
# conflict, GitHub runs no `pull_request` workflows, because `refs/pull/N/merge`
# cannot be computed. The push run still goes green on `verify` and `snapshots`,
# both attach to the head SHA, and the merge box reads "All checks have passed"
# with `qa` simply absent rather than red or pending. Under the OLD triggers the
# same PR showed an EMPTY check list, which is visibly wrong; this change
# replaces that with two reassuring green rows. Resolving the conflict pushes to
# the head branch and re-fires everything, so the exposure is narrow — but if a
# base-side change removes the conflict with no head push, the PR reads clean
# with the matrix never having run. Recorded in D8.
#
# The jobs are assigned to events rather than duplicated across them: a push to
# a branch with an open PR fires BOTH events, so running the fast jobs only on
# `push` and the matrix only on `pull_request` gives full coverage of the commit
# with nothing run twice. Both attach to the same SHA, so the PR shows all four.
on:
  pull_request:
  push:
    branches: ['**']
  # An escape hatch that runs everything, for a branch with no PR that needs the
  # full matrix before one is opened.
  workflow_dispatch:

# Nothing here needs write access to anything.
permissions:
  contents: read

# ⚠ Two corrections here, both found by adversarially reviewing this file's own
# trigger change rather than by it failing.
#
# `github.event_name` is in the group because `workflow_dispatch` and `push`
# resolve `github.ref` to the SAME string on a branch. Without it, dispatching
# the full matrix on a branch and then pushing a typo fix cancels the matrix —
# and the push run does not run `qa`, so the one feature whose purpose is
# getting the matrix without a PR could be voided by the most ordinary action
# on that branch.
#
# `cancel-in-progress` is now false on main. Cancelling is right for a branch,
# where only the tip matters; on the trunk every commit is a permanent artefact
# that needs its own verdict. Two merges inside ~14 minutes — an ordinary
# afternoon — would otherwise cancel the first merge's run mid-webkit and leave
# that commit with no result at all, showing as a grey "cancelled" that reads
# like infrastructure noise.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    # Every push, every branch — the always-on signal. Not on `pull_request`:
    # the same commit was already pushed, so that would run it twice.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The build refuses to run without a delivery destination (scripts/check-env.mjs).
      # CI is not deploying anything, so it opts out explicitly rather than
      # carrying a fake webhook URL that could be mistaken for a real one.
      ALLOW_UNDELIVERED_WAITLIST: '1'
      # Left unset deliberately elsewhere, but the route smoke check needs an
      # origin to build absolute URLs against.
      NEXT_PUBLIC_SITE_URL: http://localhost:3999

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Do NOT cache .next. Security audit 01 F-16: a build over a stale .next
      # silently served 404 for two real routes whose prerendered HTML existed
      # on disk, and `next build` reported success. Always build clean.
      - name: Ensure a clean build directory
        run: rm -rf .next

      - name: Translation catalogues
        run: npm run check:i18n

      - name: Copy invariants
        run: npm run check:copy

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Route smoke check
        run: npm run check:routes

      - name: No secrets in the diff
        run: |
          if git grep -InE "(ghp_|gho_|ghu_|ghs_|ghr_|github_pat_)[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----" -- . ; then
            echo "::error::A token-shaped string is present in the tree."
            exit 1
          fi
          echo "no token-shaped strings"

      - name: Dependency advisories (report only)
        # Does not fail the build. The three outstanding highs are accepted and
        # documented in SECURITY.md, and only Next 16 resolves them. This step
        # exists so a NEW advisory is visible in the log rather than silent.
        run: npm audit || true

  # Blocking. It was non-blocking while it was being introduced; the record that
  # earned the gate is three failures, all three real defects — a lockfile out of
  # sync, a console detector counting cancelled prefetches, and upload-artifact
  # silently dropping every dot-prefixed file — and zero flakes.
  #
  # If a genuine flake ever blocks an urgent merge, re-add
  # `continue-on-error: true` AS ITS OWN COMMIT WITH A REASON, and remove it
  # again once the flake is fixed. Do not disable this silently: a gate that is
  # quietly bypassed is worse than one that was never added, because it still
  # reads as protection. See docs/qa-report-01.md.
  #
  # Runs in parallel with `verify` — no `needs:` between them — so wall time is
  # the longer of the two (~8.7 min), not the sum.
  qa:
    # The expensive half — ~22 billable minutes across the two engines. On pull
    # requests, on main, and on demand; not on every branch push, which would
    # exhaust the monthly allowance in a fortnight.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # One job per engine, in parallel. Work order §4.5: the matrix measured
    # past fifteen minutes on a single runner. Nothing is thinned — every spec
    # still runs in both engines — the two halves just no longer wait for each
    # other. The `snapshots` job below is a third, pinned to its container.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]

    env:
      ALLOW_UNDELIVERED_WAITLIST: '1'
      QA_PORT: '3210'
      QA_SINK_PORT: '4556'
      NEXT_PUBLIC_SITE_URL: http://localhost:3210
      # The build gate needs a destination. Playwright starts the sink itself
      # (see the webServer array in playwright.config.ts), so this points at it.
      WAITLIST_WEBHOOK_URL: http://localhost:4556/

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Cached separately from node_modules: the binaries are ~500 MB and are
      # keyed on the Playwright version, which changes far less often than the
      # dependency tree. Without this the download runs on every single job.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps installs the system libraries WebKit and Chromium need on a
      # bare ubuntu runner. Without it the engines install but fail to launch.
      # Always run it: on a cache hit it is a fast no-op for the binaries but
      # still installs the apt packages, which are not cached.
      - name: Install browser engine
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Build
        run: rm -rf .next && npm run build

      - name: QA suite
        run: npm run qa -- --project=${{ matrix.project }}

      - name: Upload screenshots and artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-artefacts-${{ matrix.project }}
          path: |
            tests/qa/screenshots/
            tests/qa/.artifacts/
            tests/qa/.results.json
            test-results/
          # Required. `.artifacts/` and `.results.json` are dot-prefixed, and
          # upload-artifact excludes hidden files by default — the first
          # successful upload carried all 60 screenshots and silently none of
          # the measurement data, which is the half that explains a failure.
          include-hidden-files: true
          # The screenshots are the point of this artifact. If they are absent
          # something went wrong upstream and the job should say so, not shrug.
          if-no-files-found: error
          retention-days: 14

  # ADU-WEB-03 G11 — the placeholder pixel baselines.
  #
  # ⚠ Its own job, in a CONTAINER, on purpose. `ubuntu-latest` and this image are
  # both Ubuntu 24.04 but ship different font packages, so a baseline drawn in
  # one fails in the other on text rasterisation alone — the cross-platform
  # flake that gets snapshot tests deleted. `npm run qa:snapshots` runs this
  # exact image locally, so a developer regenerating baselines and CI comparing
  # them are running the same browser on the same fonts.
  #
  # The tag must track the installed Playwright. When package.json moves, this
  # and scripts/snapshot-container.mjs move with it, and the baselines are
  # regenerated in the same commit.
  snapshots:
    # Every push, every branch, for the same reason as verify. ~100s warm.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20

    env:
      ALLOW_UNDELIVERED_WAITLIST: '1'
      # Lifts the testIgnore in playwright.config.ts. Without it the run selects
      # zero tests and exits 0, which is indistinguishable from a pass.
      QA_SNAPSHOTS: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Placeholder appearance
        run: npx playwright test tests/qa/placeholder-appearance.spec.ts --project=chromium

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: g11-snapshot-diffs
          # A pixel ratio with no picture is not reviewable, and an unreviewable
          # snapshot failure is how snapshot tests end up disabled.
          path: test-results/
          # `warn`, not `error`. The job has already failed by the time this
          # runs; if the webServer never started there is nothing to upload, and
          # a second failure on top only obscures the first one.
          if-no-files-found: warn
          retention-days: 14
